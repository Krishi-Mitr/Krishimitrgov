.filter-grid {

  grid-template-columns:1fr 1fr 1fr auto;

.tool-card {

  display:flex;

}

.badge-row {
  display:flex;

  align-items:center;
  gap:8px;
  margin-bottom:6px;
}

.badge {
  font-size:0.78rem;

  padding:4px 10px;
  border-radius:999px;
  background:#e0f2fe;
  color:#0a3d62;
}

.badge-condition {

  color:#138808;
}

.tool-title {
  font-size:1.3rem;
  font-weight:800;
  color:#0a3d62;
  margin:10px 0;
}

.tool-meta {
  color:#475569;
  font-size:0.9rem;
  line-height:1.6;
  margin-bottom:10px;
}

.tool-desc {
  background:#f8fafc;
  border-left:3px solid #0a3d62;
  padding:8px 12px;
  border-radius:6px;
  font-size:0.85rem;
  color:#475569;
  margin-bottom:12px;
}

.price-box {
  background:#f8fafc;
  padding:15px;
  border-radius:12px;
  margin:15px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.price-val {

  font-weight:800;
  font-size:1.4rem;
}

.deposit-val {
  font-size:0.85rem;
  color:#64748b;
  font-weight:600;
}

.days-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  font-size:0.9rem;
  font-weight:600;
  color:#0a3d62;
}

.days-row input {
  width:80px;
  padding:8px 10px;
  text-align:center;
}

.rent-btn {
  background:#0a3d62;
  color:white;
  border:none;
  padding:14px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  width:100%;

}

.rent-btn:hover {

}

.rent-btn:disabled {

.profile-btn img {

<div class="container">

<div class="search-section">
<div class="filter-grid">

<input type="text" id="qName" placeholder="Search machine name">
<input type="text" id="qLoc" placeholder="Pickup location">

<select id="qCat">
<option value="">All Categories</option>
<option value="Tractors">Tractors</option>
<option value="Harvesting">Harvesting Equipment</option>
<option value="Seeding">Seeding Machinery</option>
<option value="Irrigation">Irrigation Tools</option>
<option value="HandTools">Hand Tools</option>
</select>

<button onclick="performSearch()"
style="background:#138808; color:white; border:none; padding:12px 30px; border-radius:12px; cursor:pointer; font-weight:700;">
Search
</button>

</div>

<script>
const db = window.db;
const loginid = sessionStorage.getItem("loginid");

if (!loginid) {
  location.href = "login";
}

const categoryLabels = {
  Tractors: "Tractors",
  Harvesting: "Harvesting Equipment",
  Seeding: "Seeding Machinery",
  Irrigation: "Irrigation Tools",
  HandTools: "Hand Tools"
};

async function fetchTools(name = "", loc = "", cat = "") {
  let req = db
    .from("tool_rentals")
    .select("*")
    .neq("user_id", loginid);

  if (name.trim()) req = req.ilike("tool_name", `%${name.trim()}%`);
  if (loc.trim()) req = req.ilike("location", `%${loc.trim()}%`);
  if (cat) req = req.eq("category", cat);

  const { data, error } = await req;
  const container = document.getElementById("toolsDisplay");

  if (error) {
    console.error("Error fetching tools:", error);
    container.innerHTML = "<h3>Error loading equipment.</h3>";
    return;
  }

  // Show tools where is_available is true or null (newly listed from tools_rental)
  const availableTools = (data || []).filter(tool => tool.is_available !== false);

  container.innerHTML = availableTools.length ? "" : "<h3>No tools available.</h3>";

  availableTools.forEach(tool => {
    const domId = tool.id ?? tool.tool_id;
    const card = document.createElement("div");
    card.className = "tool-card";

    const categoryText = categoryLabels[tool.category] || tool.category || "Equipment";
    const conditionText = tool.condition || "Good";
    const availFrom = tool.available_from || "N/A";
    const availTo = tool.available_to || "N/A";

    let maxDays = 30;
    if (tool.available_from && tool.available_to) {
      const diffTime = new Date(tool.available_to) - new Date(tool.available_from);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      if (diffDays > 0) maxDays = diffDays;
    }

    card.innerHTML = `
      <div>
        <div class="badge-row">
          <span class="badge">${categoryText}</span>
          <span class="badge badge-condition">${conditionText}</span>
        </div>

        <div class="tool-title">${tool.tool_name || "Unnamed Tool"}</div>

        <div class="tool-meta">
          <div> <strong>Pickup:</strong> ${tool.location || "N/A"}</div>
          <div> <strong>Owner:</strong> ${tool.owner_name || "Farmer"}</div>
          <div> <strong>Contact:</strong> ${tool.contact || "N/A"}</div>
          <div> <strong>Available:</strong> ${availFrom} to ${availTo}</div>
        </div>

        ${tool.description ? `<div class="tool-desc">${tool.description}</div>` : ""}
      </div>

      <div>
        <div class="price-box">
          <div>
            <div class="price-val">₹${tool.price_per_day || 0}<span style="font-size:0.85rem; font-weight:600; color:#64748b;">/day</span></div>
          </div>
          <div class="deposit-val">
            Deposit: ₹${tool.security_deposit || 0}
          </div>
        </div>

        <div class="days-row">
          <label for="days_${domId}">Rental Days:</label>
          <input type="number" id="days_${domId}" value="1" min="1" max="${maxDays}">
        </div>

        <button class="rent-btn" id="btn_${domId}">
          Request Rental
        </button>
      </div>
    `;

    container.appendChild(card);

    const rentBtn = card.querySelector(`#btn_${domId}`);
    const daysInput = card.querySelector(`#days_${domId}`);

    rentBtn.addEventListener("click", () => {
      const requestedDays = Math.max(1, parseInt(daysInput.value, 10) || 1);
      sendRequest(tool, requestedDays, rentBtn);
    });
  });
}

async function sendRequest(tool, requestedDays, btnElement) {
  // notifications.tool_id expects the integer primary key (tool.id)
  const numericToolId = Number(tool.id);
  const pricePerDay = Number(tool.price_per_day) || 0;
  const totalPrice = pricePerDay * requestedDays;

  if (btnElement) {
    btnElement.disabled = true;
    btnElement.textContent = "Sending Request...";
  }

  const { data: user } = await db
    .from("logindata")
    .select("name")
    .eq("loginid", loginid)
    .maybeSingle();

  const payload = {
    sender_id: String(loginid),
    receiver_id: String(tool.user_id),
    tool_id: numericToolId,
    tool_name: tool.tool_name,
    requested_days: requestedDays,
    total_price: totalPrice,
    sender_name: user?.name || "Farmer",
    status: "Pending"
  };

  console.log("Sending Notification Data:", payload);

  const { error: notifError } = await db.from("notifications").insert([payload]);

  if (notifError) {
    console.error("Notification Error:", notifError);
    alert("Failed to send rental request: " + notifError.message);
    if (btnElement) {
      btnElement.disabled = false;
      btnElement.textContent = "Request Rental";
    }
    return;
  }

  const { error: updateError } = await db
    .from("tool_rentals")
    .update({ is_available: false })
    .eq("id", numericToolId);

  if (updateError) {
    console.log("ERROR:", updateError);
  }

  alert(`Request sent for ${tool.tool_name} (${requestedDays} day(s) - Total: ₹${totalPrice})!`);
  performSearch();
}

function performSearch() {
  fetchTools(
    document.getElementById("qName").value,
    document.getElementById("qLoc").value,
    document.getElementById("qCat").value
  );
}

const menuBtn = document.getElementById("menuBtn");
const sideNav = document.getElementById("sideNav");
const navOverlay = document.getElementById("navOverlay");

menuBtn.onclick = () => {
  const isOpen = document.body.classList.toggle("drawer-open");
  sideNav.hidden = !isOpen;
  navOverlay.hidden = !isOpen;
};

navOverlay.onclick = () => {
  document.body.classList.remove("drawer-open");
  sideNav.hidden = true;
  navOverlay.hidden = true;
};

function applyRoleControl() {
  const usertype = sessionStorage.getItem("usertype");

  if (usertype === "Farmer") {
    document.getElementById("marketSection").style.display = "block";

    document.querySelectorAll(".farmer-only").forEach(el => {
      el.style.display = "block";
    });
  }
}

applyRoleControl();
fetchTools();
</script>
